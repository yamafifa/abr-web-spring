<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head><title>ABR 住居マスター</title></head>
<body>
<main class="mx-auto w-full max-w-7xl flex-1 px-4 py-8 sm:px-6"
      th:with="r=${result}, from=${r.total() == 0 ? 0 : (r.page() - 1) * query.perPage() + 1}, to=${(r.page() - 1) * query.perPage() + r.rows().size()}">
    <div class="space-y-6">
        <div class="flex flex-wrap items-end justify-between gap-3">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white">住居の検索 <span class="ml-1 rounded-full bg-cyan-400/15 px-2.5 py-0.5 align-middle text-xs font-semibold text-cyan-300 ring-1 ring-cyan-400/40">DB</span></h1>
                <p class="mt-1 text-sm text-slate-400">住居表示-住居マスター（東京都）を検索して、編集・削除します。</p>
            </div>
            <a th:href="${esUrl}" class="text-sm text-amber-300 hover:underline">同じ条件で Elasticsearch 検索 →</a>
        </div>

        <section th:replace="~{fragments :: searchForm(${query.criteria()}, ${query.perPage()}, @{/})}"></section>

        <section class="overflow-hidden rounded-2xl border border-white/10 bg-slate-900/50 shadow-xl shadow-black/20 backdrop-blur">
            <div class="flex flex-wrap items-baseline justify-between gap-2 border-b border-white/10 px-5 py-3 text-sm">
                <p class="text-slate-400"><span id="total" class="font-mono text-lg font-semibold text-white" th:text="${#numbers.formatInteger(r.total(), 1, 'COMMA')}">0</span> 件</p>
                <p class="font-mono text-xs text-slate-500"
                   th:text="|${#numbers.formatInteger(from, 1, 'COMMA')}–${#numbers.formatInteger(to, 1, 'COMMA')} 件目 ／ ${#numbers.formatInteger(r.page(), 1, 'COMMA')} / ${#numbers.formatInteger(r.totalPages(), 1, 'COMMA')} ページ|">1–15 件目</p>
            </div>

            <p th:if="${r.rows().isEmpty()}" class="px-5 py-16 text-center text-slate-500">該当する住居がありません</p>
            <div th:unless="${r.rows().isEmpty()}" th:replace="~{fragments :: rsdtTable(${r.rows()}, ${back})}"></div>

            <div th:if="${r.totalPages() > 1}" class="border-t border-white/10 px-5 py-4">
                <nav th:replace="~{fragments :: pager(${pager})}"></nav>
            </div>
        </section>
    </div>
</main>
</body>
</html>
