<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head><title th:text="${rsdt.address() + ' の編集'}">編集</title></head>
<body>
<main class="mx-auto w-full max-w-7xl flex-1 px-4 py-8 sm:px-6">
    <div class="space-y-6">
        <div>
            <a th:href="${back}" class="text-sm text-slate-400 hover:text-cyan-300">‹ 一覧に戻る</a>
            <h1 class="mt-2 text-2xl font-bold tracking-tight text-white" th:text="${rsdt.address()}">住所</h1>
            <dl class="mt-3 flex flex-wrap gap-2">
                <div th:each="e : ${rsdt.key().toMap()}" class="rounded-lg border border-white/10 bg-slate-900/50 px-3 py-1.5">
                    <dt class="font-mono text-[10px] text-slate-500" th:text="${e.key}">列</dt>
                    <dd class="font-mono text-sm text-slate-200">
                        <span th:if="${!e.value.isEmpty()}" th:text="${e.value}">値</span><span th:if="${e.value.isEmpty()}" class="text-slate-600">（空）</span>
                    </dd>
                </div>
            </dl>
            <p class="mt-2 text-xs text-slate-500">主キーの 5 列は変更できません。</p>
        </div>

        <!--/* 「更新」を押すと、すぐには送らず、変わった項目をモーダルで見せる（confirm_controller.js の diff） */-->
        <div data-controller="confirm" data-confirm-diff-value="true" data-action="submit->confirm#open"
             th:with="originals=${rsdt.formValues()}">
            <form method="post" th:action="@{/rsdt/{id}(id=${rsdt.routeId()},back=${back})}" th:object="${form}" novalidate
                  class="rounded-2xl border border-white/10 bg-slate-900/50 shadow-xl shadow-black/20 backdrop-blur">
                <input type="hidden" name="_method" value="patch">
                <div class="grid gap-x-6 gap-y-5 p-6 sm:grid-cols-2 lg:grid-cols-3">
                    <label th:each="rule : ${rules}" class="block" th:classappend="${rule.column() == 'remarks'} ? 'sm:col-span-2 lg:col-span-3'"
                           th:with="invalid=${#fields.hasErrors(rule.property())}">
                        <span class="mb-1.5 flex items-baseline justify-between font-mono text-xs text-slate-400">
                            <span><th:block th:text="${rule.column()}">列</th:block><span th:if="${rule.required()}" class="ml-1 text-rose-400">*</span></span>
                            <span th:if="${!rule.date()}" class="text-[10px] text-slate-600" th:text="|最大 ${rule.max()} 文字|">最大</span>
                        </span>
                        <!--/* th:field が name・id・value を入れる。入力チェックに通らず出し直したときは、入力したままの値が入る */-->
                        <input th:type="${rule.date()} ? 'date' : 'text'" th:field="*{__${rule.property()}__}"
                               th:attr="maxlength=${rule.date()} ? null : ${rule.max()},data-column=${rule.column()},data-original=${originals[rule.column()]},aria-invalid=${invalid}"
                               data-confirm-target="field"
                               class="w-full rounded-lg border bg-slate-950/60 px-3 py-2 text-sm text-white outline-none transition focus:ring-2"
                               th:classappend="${invalid} ? 'border-rose-400/60 focus:ring-rose-400/20' : 'border-white/10 focus:border-cyan-400/60 focus:ring-cyan-400/20'">
                        <span th:if="${invalid}" class="field-error mt-1 block text-xs text-rose-400" th:errors="*{__${rule.property()}__}">エラー</span>
                    </label>
                </div>
                <div class="flex items-center gap-3 border-t border-white/10 bg-slate-950/30 px-6 py-4">
                    <a th:href="${back}" class="ml-auto rounded-lg px-4 py-2 text-sm text-slate-300 hover:bg-white/5">キャンセル</a>
                    <button type="submit" class="cursor-pointer rounded-lg bg-gradient-to-r from-cyan-400 to-sky-500 px-6 py-2 text-sm font-semibold text-slate-950 shadow-lg shadow-cyan-500/20 transition hover:brightness-110">更新</button>
                </div>
            </form>
            <dialog th:replace="~{fragments :: confirmDialog('この内容で更新しますか？', '更新する', false, ~{fragments :: diffBody})}"></dialog>
        </div>

        <!--/* 削除ボタンは自分のフォームを持つので、編集フォームの外に置く（フォームは入れ子にできない） */-->
        <div class="flex justify-start">
            <div th:replace="~{fragments :: deleteButton(${rsdt}, ${back}, false)}"></div>
        </div>
    </div>
</main>
</body>
</html>
