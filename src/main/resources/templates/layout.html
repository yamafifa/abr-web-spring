<!DOCTYPE html>
<!--/* 全画面のレイアウト。各画面は th:replace="~{layout :: layout(~{::title}, ~{::main})}" で、自分の <title> と <main> を入れる */-->
<html lang="ja" class="h-full antialiased" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="住居表示-住居マスター（mt_rsdtdsp_rsdt）の検索・編集・削除">
    <title th:replace="${title}">ABR 住居マスター</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono&family=Noto+Sans+JP:wght@400;500;700&display=swap">
    <!--/* npm run build で作った JS と CSS（vite.config.js） */-->
    <link rel="stylesheet" th:href="@{/build/app.css}">
    <script type="module" th:src="@{/build/app.js}"></script>
</head>
<body class="flex min-h-full flex-col font-sans">
    <header class="border-b border-white/10 bg-slate-950/40 backdrop-blur">
        <div class="mx-auto flex max-w-7xl items-center gap-3 px-4 py-4 sm:px-6">
            <a th:href="@{/}" class="group flex items-center gap-3">
                <span class="grid size-8 place-items-center rounded-lg bg-gradient-to-br from-lime-300 to-green-500 text-sm font-bold text-slate-950 shadow-lg shadow-green-500/20">J</span>
                <span class="font-semibold tracking-wide text-slate-100 group-hover:text-white">ABR 住居マスター</span>
            </a>
            <!--/* DB 検索と Elasticsearch 検索の切り替え（currentPage はコントローラーが入れる） */-->
            <nav class="ml-6 flex gap-1 text-sm" th:with="cur=${#ctx.containsVariable('currentPage') ? currentPage : ''}">
                <a th:href="@{/}" class="rounded-lg px-3 py-1.5" th:classappend="${cur == 'db'} ? 'bg-white/10 font-medium text-white' : 'text-slate-400 hover:bg-white/5 hover:text-white'">DB 検索</a>
                <a th:href="@{/es}" class="rounded-lg px-3 py-1.5" th:classappend="${cur == 'es'} ? 'bg-white/10 font-medium text-white' : 'text-slate-400 hover:bg-white/5 hover:text-white'">Elasticsearch 検索</a>
            </nav>
            <span class="ml-auto rounded-full border border-white/10 px-2.5 py-0.5 font-mono text-xs text-slate-400">mt_rsdtdsp_rsdt</span>
        </div>
    </header>

    <!--/* 更新・削除のあとのお知らせ。3 秒で消える（frontend/controllers/flash_controller.js） */-->
    <div th:each="m : ${ {'notice', 'alert'} }" th:if="${#ctx.containsVariable(m) and #ctx.getVariable(m) != null}"
         data-controller="flash"
         class="fixed right-4 top-20 z-50 flex items-center gap-2 rounded-xl border px-4 py-3 text-sm shadow-lg shadow-black/30 backdrop-blur transition-opacity duration-300"
         th:classappend="${m == 'notice'} ? 'border-emerald-400/30 bg-emerald-500/15 text-emerald-200' : 'border-rose-400/30 bg-rose-500/15 text-rose-200'">
        <span class="size-2 rounded-full" th:classappend="${m == 'notice'} ? 'bg-emerald-400' : 'bg-rose-400'"></span>
        <span th:text="${#ctx.getVariable(m)}">お知らせ</span>
    </div>

    <main th:replace="${content}" class="mx-auto w-full max-w-7xl flex-1 px-4 py-8 sm:px-6"></main>
    <footer class="py-6 text-center text-xs text-slate-500">Spring Boot + MyBatis + Thymeleaf + Tailwind CSS + Stimulus</footer>
</body>
</html>
