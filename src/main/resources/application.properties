spring.application.name=abr-web-spring

# サーバー（ほかの版と同じく 127.0.0.1:3000）
server.address=127.0.0.1
server.port=3000

# DB は abr-batch の MySQL を共用する。テーブルを作ったり SQL のファイルを流したりはしない
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/abr?characterEncoding=UTF-8&connectionTimeZone=SERVER
spring.datasource.username=abr
spring.datasource.password=abr
spring.sql.init.mode=never

# MyBatis：SQL は src/main/resources/mapper/*.xml に書く。列名の snake_case を、Java の camelCase に合わせる
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
# record（Rsdt）のコンストラクターに、引数の名前で列を渡す
mybatis.configuration.arg-name-based-constructor-auto-mapping=true

# フォームの隠し項目 _method（PATCH・DELETE）を読む
spring.mvc.hiddenmethod.filter.enabled=true

# セッション（お知らせを redirect 先に渡すのに使う）は Cookie だけで持つ。
# 既定のままだと、初めての redirect で URL に ;jsessionid=... が付いた
server.servlet.session.tracking-modes=cookie
